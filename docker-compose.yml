services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: opendk-app
    restart: unless-stopped
    volumes:
      - ./project:/var/www/html
      - ./project/storage:/var/www/html/storage
    env_file:
      - ./project/.env
    networks:
      - opendk-network

  db:
    image: mariadb:10.6
    container_name: opendk-db
    restart: unless-stopped
    env_file:
      - ./project/.env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - opendk-network

  web:
    image: nginx:stable
    container_name: opendk-web
    restart: unless-stopped
    ports:
      - "9011:80"
    volumes:
      - ./project:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - opendk-network

networks:
  opendk-network:

volumes:
  db_data:
